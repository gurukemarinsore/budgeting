<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#187CFC">
    <title>Budgeting — Offline</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: 1.5rem; display: flex; align-items: center; justify-content: center; background: #F8FAFC; color: #1E293B; font-family: system-ui, -apple-system, sans-serif; }
        main { width: min(100%, 24rem); padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1.5rem; background: #fff; text-align: center; box-shadow: 0 12px 40px rgba(15,23,42,.06); }
        img { display: block; width: 4.5rem; height: 4.5rem; margin: 0 auto 1.25rem; object-fit: contain; }
        h1 { margin: 0 0 .75rem; font-size: 1.25rem; line-height: 1.4; }
        p { margin: 0; font-size: .9375rem; color: #64748b; line-height: 1.6; }
        .wait { display: flex; align-items: center; justify-content: center; gap: .65rem; margin: 1.5rem 0; color: #187CFC; font-size: .8125rem; }
        .spinner { width: 1rem; height: 1rem; flex-shrink: 0; border: 2px solid #dbeafe; border-top-color: #187CFC; border-radius: 50%; animation: spin 1s linear infinite; }
        button { width: 100%; padding: .8rem 1rem; border: 0; border-radius: .8rem; background: #187CFC; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        button:hover { background: #00569E; }
        button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
        button:disabled { opacity: .65; cursor: wait; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
</head>
<body>
    <main>
        <img src="./icons/icon-192.png" width="72" height="72" alt="Budgeting">
        <div role="status" aria-live="polite" aria-atomic="true">
            <h1>Anda sedang offline</h1>
            <p id="connection-message">Hubungkan ke internet untuk melanjutkan. Transaksi hanya dapat disimpan saat online.</p>
        </div>
        <div class="wait"><span class="spinner" aria-hidden="true"></span>Menunggu koneksi internet...</div>
        <button id="retry-button" type="button">Coba lagi</button>
    </main>
    <script>
        const button = document.getElementById('retry-button');
        const message = document.getElementById('connection-message');
        let checking = false;

        async function retryConnection() {
            if (checking) return;
            if (navigator.onLine === false) {
                message.textContent = 'Anda masih offline. Hubungkan ke internet untuk melanjutkan.';
                return;
            }
            checking = true;
            button.disabled = true;
            button.textContent = 'Memeriksa koneksi...';
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            try {
                const appUrl = new URL('./', location.href);
                const response = await fetch(appUrl, { method: 'HEAD', cache: 'no-store', signal: controller.signal });
                if (!response.ok) throw new Error('Halaman tidak tersedia.');
                location.replace(appUrl.href);
            } catch (error) {
                message.textContent = 'Koneksi belum tersedia. Periksa jaringan Anda, lalu coba lagi.';
            } finally {
                clearTimeout(timer);
                checking = false;
                button.disabled = false;
                button.textContent = 'Coba lagi';
            }
        }
        button.addEventListener('click', retryConnection);
        window.addEventListener('online', retryConnection);
    </script>
</body>
</html>
